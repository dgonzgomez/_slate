name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: slate-release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
jobs:
  version:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version and release notes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/release_notes.py --version)
          python3 scripts/release_notes.py > "$RUNNER_TEMP/slate-notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/slate-release.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v$version")
          case "$status" in
            200) echo 'release=false' >> "$GITHUB_OUTPUT" ;;
            404) echo 'release=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Could not check existing releases (HTTP $status)."; exit 1 ;;
          esac
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to the obsolete "tools" package, which is no
          # longer available. Request only the SDK packages this build uses.
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Check repository
        run: |
          python3 scripts/audit_repository.py
          bash -n build.sh scripts/install.sh
      - name: Restore release signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.SLATE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo '::error::Add the existing Slate signing key as SLATE_KEYSTORE_BASE64 before building releases.'
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/slate.keystore"
      - name: Build release APK
        if: github.event_name != 'pull_request'
        env:
          SLATE_RELEASE: '1'
          SLATE_KEYSTORE: ${{ runner.temp }}/slate.keystore
          SLATE_STORE_PASSWORD: ${{ secrets.SLATE_STORE_PASSWORD }}
          SLATE_KEY_PASSWORD: ${{ secrets.SLATE_KEY_PASSWORD }}
          SLATE_KEY_ALIAS: ${{ vars.SLATE_KEY_ALIAS || 'androiddebugkey' }}
          SLATE_REPOSITORY: ${{ github.repository }}
        run: bash build.sh
      - name: Build pull request APK (development key)
        if: github.event_name == 'pull_request'
        run: bash build.sh
      - name: Verify signing certificate
        if: github.event_name != 'pull_request'
        run: |
          actual=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs build/Slate-firetv.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          expected=$(cat signing-certificate.sha256)
          if [ "$actual" != "$expected" ]; then
            echo '::error::Signing certificate differs from existing Slate installations.'
            exit 1
          fi
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version.name=//p' release.properties)
          test "$GITHUB_REF_NAME" = "v$version" || { echo '::error::Release tag and version.name must match'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'Slate-development' || 'Slate-firetv' }}
          path: |
            build/Slate-firetv.apk
            build/Slate-firetv.apk.sha256
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/slate.keystore"
  release:
    needs: [version, build]
    if: >-
      needs.version.outputs.release == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Slate-firetv
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 scripts/release_notes.py > "$RUNNER_TEMP/slate-notes.md"
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Slate $VERSION" --notes-file "$RUNNER_TEMP/slate-notes.md"
